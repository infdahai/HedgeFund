[package]
name = "opinion-hft"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "High-frequency trading framework for Opinion Trade prediction market on BNB Chain"
license = "MIT"

[dependencies]
# Async Runtime
tokio = { version = "1.35", features = ["full", "tracing"] }
futures = "0.3"

# Ethereum / EIP-712
alloy-primitives = "0.8"
alloy-sol-types = "0.8"
alloy = { version = "0.3", features = ["providers", "signers", "contract", "signer-local"] }
k256 = { version = "0.13", features = ["ecdsa"] }

# Rate Limiting
governor = "0.6"
nonzero_ext = "0.3"

# Networking
reqwest = { version = "0.12", features = ["json"] }
rquest = { version = "5.1", features = ["json"] }
rquest-util = { version = "2.2", features = ["emulation"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2.5"

# Data Structures
dashmap = "6.0"
priority-queue = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# Environment configuration
dotenvy = "0.15"
tracing-appender = "0.2.4"
simd-json = "0.14.3"
secrecy = "0.10.3"
zeroize = "1.8.2"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"
mockall = "0.13"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "signer_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
