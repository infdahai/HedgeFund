name: Quick Check

# Trigger on every push and pull request
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Optimize for CI: use all available cores, enable parallel builds
  CARGO_BUILD_JOBS: "4"
  # Compile tests in debug mode (10x faster than release)
  CARGO_PROFILE_TEST_DEBUG: true

jobs:
  quick-check:
    name: Rust Quick Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Faster caching with actions/cache for cargo registry and target directories
      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Install sccache for faster Rust compilation caching
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Run sccache stats before build
        run: sccache --show-stats

      # Step 1: Format check (fast, no deps)
      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      # Step 2: Clippy on lib only (skip tests/bins for speed)
      - name: Run Clippy (Linting with Fail onWarnings)
        run: cargo clippy --lib -- -D warnings

      # Step 3: Unit tests in debug mode (much faster than release)
      - name: Run Unit Tests (Debug Build)
        run: cargo test --lib -- --test-threads=4

      # Step 4: Final build check (all targets, all features)
      - name: Build Check (Ensure Code Compiles)
        run: cargo check --all-targets --all-features

      - name: Run sccache stats after build
        run: sccache --show-stats

      - name: Summary
        if: always()
        run: |
          echo "✅ Quick Check passed!"
          echo "📊 All critical quality gates passed:"
          echo "  - Code formatting (rustfmt)"
          echo "  - Linting (clippy with -D warnings)"
          echo "  - Unit tests (--lib only, no integration tests)"
          echo ""
          echo "⏱️  Quick Check duration: < 2 minutes (target)"
